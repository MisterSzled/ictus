[project]
name = "ictus"
# Pre-1.0: the stdlib's constructors are the API, and they still move. Every
# move is in CHANGELOG.md, which is the only way somebody downstream can find
# out — `test_changelog.py` refuses a version with no entry.
version = "0.1.0"
description = "Typed composition, validation and linting for multi-stage agent pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "MisterSzled" }]
# pydantic was declared and never imported. The emitter constructs plain
# YAML values and the Conductor CLI is the schema authority.
dependencies = ["ruamel.yaml==0.18.10", "typer==0.20.0", "click==8.5.0"]

[project.scripts]
ictus = "ictus.cli:app"
# A daemon, not a compiler verb. See src/ictus/bridge/__init__.py.
ictus-bridge = "ictus.bridge.cli:app"

# ictus's own adapters register the same way a third party's would. Declaring
# them here rather than hard-coding a list is what keeps the mechanism honest:
# a registry whose only real users are other people is one nobody notices break.
# A pipeline still imports the constructor by name; this is how `ictus adapters`
# knows what exists.
[project.entry-points."ictus.notify"]
slack_channel = "ictus.notify.slack:slack_channel"
slack_webhook = "ictus.notify.slack:slack_webhook"
jira_cloud = "ictus.notify.jira:jira_cloud"

[project.entry-points."ictus.sources"]
readonly_sqlite = "ictus.sources.sqlite:readonly_sqlite"
readonly_postgres = "ictus.sources.postgres:readonly_postgres"
readonly_postgres_fleet = "ictus.sources.fleet:readonly_postgres_fleet"
readonly_jira = "ictus.sources.jira:readonly_jira"

[tool.hatch.build.targets.wheel]
packages = ["src/ictus"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy==1.18.2", "ruff==0.16.6", "pytest==8.4.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# Path is immutable, so sharing one as a CLI default is safe — which is the
# hazard B008 exists to catch.
extend-immutable-calls = ["pathlib.Path"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "TCH", "ARG", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
